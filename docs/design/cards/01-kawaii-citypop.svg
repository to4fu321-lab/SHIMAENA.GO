<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 840" width="600" height="840">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb3d9"/><stop offset="0.5" stop-color="#cdbaff"/><stop offset="1" stop-color="#9fe8e1"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4fcf"/><stop offset="1" stop-color="#2fb5c9"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="pic"><rect x="30" y="30" width="540" height="560" rx="26"/></clipPath>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2" fill="#fff" opacity="0.5"/></pattern>
  </defs>
  <rect width="600" height="840" rx="28" fill="#fff6fb"/>
  <g clip-path="url(#pic)">
    <!-- 夜空（上）とパステル（全体） -->
    <rect x="30" y="30" width="540" height="560" fill="url(#night)"/>
    <rect x="30" y="30" width="540" height="560" fill="url(#bg)" opacity="0.55"/>
    <!-- ボケ光 -->
    <g fill="#fff" opacity="0.18"><circle cx="120" cy="120" r="40"/><circle cx="470" cy="200" r="55"/><circle cx="300" cy="90" r="30"/><circle cx="90" cy="330" r="48"/><circle cx="520" cy="360" r="36"/></g>
    <!-- メンフィス柄 -->
    <g fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M60 250 l18 -22 l18 22 l18 -22 l18 22" stroke="#ff7ab8"/>
      <path d="M430 100 l16 -20 l16 20 l16 -20 l16 20" stroke="#fff27a"/>
      <path d="M90 440 q10 -14 20 0 t20 0 t20 0" stroke="#7af0d7"/>
      <path d="M480 450 q10 -14 20 0 t20 0 t20 0" stroke="#ff7ab8"/>
      <polygon points="520,130 540,165 500,165" stroke="#7af0d7" fill="#7af0d7" opacity="0.9"/>
      <polygon points="70,160 86,190 54,190" stroke="#ff7ab8" fill="none"/>
      <circle cx="400" cy="60" r="9" stroke="#fff" fill="none"/>
      <rect x="140" y="60" width="18" height="18" stroke="#fff27a" fill="#fff27a" transform="rotate(20 149 69)"/>
    </g>
    <!-- 流れ星・きらきら -->
    <g stroke="#fff" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)">
      <path d="M380 150 l70 -30"/><path d="M110 60 l55 -18"/>
      <path d="M470 290 l-8 0 M466 286 l0 8" stroke-width="3"/>
      <path d="M160 300 l-10 0 M155 295 l0 10" stroke-width="3"/>
    </g>
    <g fill="#fff27a" filter="url(#glow)"><polygon points="450,120 455,132 468,133 458,141 461,154 450,147 439,154 442,141 432,133 445,132"/><polygon points="150,130 153,138 162,139 155,144 157,153 150,148 143,153 145,144 138,139 147,138" fill="#ff7ab8"/></g>
    <!-- ネオン看板 -->
    <g filter="url(#glow)">
      <text x="225" y="150" font-family="Georgia, serif" font-style="italic" font-size="56" fill="#fff" stroke="#ff7ab8" stroke-width="2" text-anchor="middle">Shimaena</text>
      <text x="285" y="208" font-family="Georgia, serif" font-style="italic" font-size="50" fill="#fff" stroke="#7af0d7" stroke-width="2" text-anchor="middle">GO!</text>
      <path d="M185 192 q28 14 56 0" stroke="#fff27a" stroke-width="3" fill="none"/>
    </g>
    <!-- 吹き出し -->
    <g filter="url(#glow)">
      <path d="M396 230 h150 a10 10 0 0 1 10 10 v36 a10 10 0 0 1 -10 10 h-110 l-18 14 v-14 h-22 a10 10 0 0 1 -10 -10 v-36 a10 10 0 0 1 10 -10 z" fill="none" stroke="#fff27a" stroke-width="2.5"/>
      <text x="471" y="265" font-family="Georgia, serif" font-style="italic" font-size="18" fill="#fff27a" text-anchor="middle">Have a nice snow day!</text>
    </g>
    <!-- 街のシルエット（窓が光る） -->
    <g fill="#3b2a78" opacity="0.75">
      <rect x="30" y="330" width="60" height="140"/><rect x="95" y="300" width="45" height="170"/><rect x="145" y="340" width="70" height="130"/>
      <rect x="220" y="290" width="50" height="180"/><rect x="275" y="320" width="80" height="150"/><rect x="360" y="300" width="40" height="170"/>
      <rect x="405" y="340" width="75" height="130"/><rect x="485" y="310" width="50" height="160"/><rect x="540" y="350" width="40" height="120"/>
    </g>
    <g fill="#fff27a" opacity="0.9">
      <rect x="40" y="345" width="6" height="8"/><rect x="60" y="360" width="6" height="8"/><rect x="104" y="315" width="6" height="8"/><rect x="124" y="340" width="6" height="8"/>
      <rect x="160" y="355" width="6" height="8"/><rect x="190" y="370" width="6" height="8"/><rect x="232" y="305" width="6" height="8"/><rect x="250" y="330" width="6" height="8"/>
      <rect x="290" y="335" width="6" height="8"/><rect x="330" y="350" width="6" height="8"/><rect x="372" y="315" width="6" height="8"/><rect x="420" y="355" width="6" height="8"/>
      <rect x="455" y="372" width="6" height="8"/><rect x="498" y="325" width="6" height="8"/><rect x="552" y="365" width="6" height="8"/><rect x="310" y="380" width="6" height="8"/>
    </g>
    <!-- グリッド床（雪原） -->
    <rect x="30" y="470" width="540" height="120" fill="#e9f3ff"/>
    <g stroke="#7af0d7" stroke-width="1.5" opacity="0.9">
      <line x1="30" y1="500" x2="570" y2="500"/><line x1="30" y1="530" x2="570" y2="530"/><line x1="30" y1="565" x2="570" y2="565"/>
      <line x1="300" y1="470" x2="300" y2="590"/><line x1="300" y1="470" x2="150" y2="590"/><line x1="300" y1="470" x2="450" y2="590"/>
      <line x1="300" y1="470" x2="0" y2="590"/><line x1="300" y1="470" x2="600" y2="590"/>
    </g>
    <!-- シマエナガ3羽（耳あて・マフラー・スコップ） -->
    <g id="enaga">
      <ellipse cx="0" cy="40" rx="44" ry="10" fill="#9fb8d8" opacity="0.4"/>
      <ellipse cx="0" cy="0" rx="46" ry="42" fill="#fff" stroke="#8a7bb5" stroke-width="2.5"/>
      <circle cx="-14" cy="-6" r="4" fill="#3b2a78"/><circle cx="14" cy="-6" r="4" fill="#3b2a78"/>
      <path d="M-4 8 L4 8 L0 13 Z" fill="#3b2a78"/>
      <ellipse cx="-26" cy="10" rx="9" ry="6" fill="#ffb3d9"/><ellipse cx="26" cy="10" rx="9" ry="6" fill="#ffb3d9"/>
      <path d="M-40 -14 q40 -34 80 0" stroke="#8a7bb5" stroke-width="3" fill="none"/>
      <path d="M-46 -8 q0 -16 12 -12 q-6 12 -12 12 z" fill="#ff7ab8"/><circle cx="-43" cy="-13" r="9" fill="#ff7ab8" stroke="#8a7bb5" stroke-width="2"/>
      <circle cx="43" cy="-13" r="9" fill="#ff7ab8" stroke="#8a7bb5" stroke-width="2"/>
      <path d="M-30 28 q30 18 60 0 l0 12 q-30 18 -60 0 z" fill="#7af0d7" stroke="#8a7bb5" stroke-width="2"/>
    </g>
    <use href="#enaga" x="150" y="500"/>
    <use href="#enaga" x="300" y="505" transform="scale(1.08) translate(-22 -40)"/>
    <use href="#enaga" x="450" y="500"/>
    <!-- 別色の耳あて・マフラー -->
    <g>
      <circle cx="107" cy="487" r="9" fill="#fff27a" stroke="#8a7bb5" stroke-width="2"/><circle cx="193" cy="487" r="9" fill="#fff27a" stroke="#8a7bb5" stroke-width="2"/>
      <circle cx="407" cy="487" r="9" fill="#cdbaff" stroke="#8a7bb5" stroke-width="2"/><circle cx="493" cy="487" r="9" fill="#cdbaff" stroke="#8a7bb5" stroke-width="2"/>
    </g>
    <!-- スコップ -->
    <g transform="translate(506 468) rotate(18)">
      <rect x="-4" y="-56" width="8" height="78" rx="3" fill="#8a7bb5"/><path d="M-18 18 h36 l-5 30 h-26 z" fill="#ff7ab8" stroke="#8a7bb5" stroke-width="2"/>
    </g>
    <text x="300" y="580" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#6b4fcf" text-anchor="middle">City pop na Shimaenaga.</text>
  </g>
  <rect x="30" y="30" width="540" height="560" rx="26" fill="none" stroke="#fff" stroke-width="6"/>
  <rect x="30" y="30" width="540" height="560" rx="26" fill="none" stroke="#cdbaff" stroke-width="2"/>

  <!-- 消印（右上） -->
  <g transform="translate(494 96) rotate(-12)">
    <circle cx="0" cy="0" r="60" fill="#fff6fb" opacity="0.75"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#d81b60" stroke-width="4"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#d81b60" stroke-width="2"/>
    <path id="aT" d="M-50 0 A50 50 0 0 1 50 0" fill="none"/><path id="aB" d="M-50 0 A50 50 0 0 0 50 0" fill="none"/>
    <text font-family="Noto Sans JP, sans-serif" font-size="12" font-weight="700" fill="#d81b60" letter-spacing="2"><textPath href="#aT" startOffset="50%" text-anchor="middle">しらかば町内</textPath></text>
    <text font-family="Noto Sans JP, sans-serif" font-size="11" font-weight="700" fill="#d81b60" letter-spacing="2"><textPath href="#aB" startOffset="50%" text-anchor="middle">2026.12.14</textPath></text>
    <text x="0" y="2" font-family="Arial Black, sans-serif" font-size="24" font-weight="900" fill="#d81b60" text-anchor="middle">720kg</text>
    <text x="0" y="24" font-family="Arial Black, sans-serif" font-size="13" font-weight="900" fill="#d81b60" text-anchor="middle" letter-spacing="1">No.007/32</text>
    <g stroke="#d81b60" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M-136 -22 q12 -6 24 0 t24 0 t24 0"/><path d="M-136 -7 q12 -6 24 0 t24 0 t24 0"/><path d="M-136 8 q12 -6 24 0 t24 0 t24 0"/><path d="M-136 23 q12 -6 24 0 t24 0 t24 0"/>
    </g>
  </g>

  <!-- 情報欄 -->
  <rect x="356" y="612" width="214" height="30" rx="15" fill="#ffb3d9"/>
  <text x="463" y="633" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#6b4fcf" text-anchor="middle" letter-spacing="2">早朝の群れ ★★ ・ 32枚限定</text>
  <text x="60" y="660" font-family="Noto Sans JP, sans-serif" font-size="32" font-weight="700" fill="#6b4fcf" letter-spacing="2">玄関までの三十歩</text>
  <text x="60" y="690" font-family="Georgia, serif" font-style="italic" font-size="18" fill="#ff4f8b" letter-spacing="1">Thirty Steps to the Door</text>
  <text x="60" y="732" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#3b2a78">田中・鈴木・ゆうき（小5）</text>
  <text x="60" y="760" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#8a7bb5" letter-spacing="1">2026.12.14 SAT ｜ キタキツネ組 × エゾリス組</text>
</svg>
