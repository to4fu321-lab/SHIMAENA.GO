<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb3d9"/><stop offset="0.5" stop-color="#cdbaff"/><stop offset="1" stop-color="#9fe8e1"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#6b4fcf" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="640" height="640" fill="url(#bg)"/>
  <!-- ぼけ光と雪 -->
  <g fill="#fff">
    <circle cx="140" cy="150" r="46" opacity="0.18"/><circle cx="520" cy="190" r="60" opacity="0.15"/><circle cx="500" cy="500" r="40" opacity="0.18"/>
    <circle cx="190" cy="110" r="6" opacity="0.9"/><circle cx="470" cy="120" r="5" opacity="0.9"/><circle cx="110" cy="330" r="5" opacity="0.8"/>
    <circle cx="540" cy="330" r="6" opacity="0.8"/><circle cx="170" cy="500" r="5" opacity="0.8"/>
  </g>
  <!-- きらきら -->
  <g fill="#fff27a" filter="url(#glow)">
    <polygon points="500,110 507,128 526,130 512,142 516,161 500,151 484,161 488,142 474,130 493,128"/>
  </g>
  <g fill="#ff7ab8" filter="url(#glow)">
    <polygon points="135,215 140,227 153,228 143,236 146,249 135,242 124,249 127,236 117,228 130,227"/>
  </g>

  <!-- シマエナガ（大きく、まんなか） -->
  <g transform="translate(320 350)" filter="url(#shadow)">
    <!-- しっぽ -->
    <path d="M150 70 L245 150" stroke="#3b2a78" stroke-width="18" stroke-linecap="round"/>
    <!-- からだ -->
    <ellipse cx="0" cy="0" rx="175" ry="160" fill="#ffffff" stroke="#8a7bb5" stroke-width="7"/>
    <!-- 耳あて -->
    <path d="M-150 -62 Q0 -200 150 -62" stroke="#8a7bb5" stroke-width="12" fill="none" stroke-linecap="round"/>
    <circle cx="-158" cy="-40" r="38" fill="#ff7ab8" stroke="#8a7bb5" stroke-width="6"/>
    <circle cx="158" cy="-40" r="38" fill="#ff7ab8" stroke="#8a7bb5" stroke-width="6"/>
    <!-- 目・くちばし・ほっぺ -->
    <circle cx="-50" cy="-18" r="16" fill="#3b2a78"/><circle cx="50" cy="-18" r="16" fill="#3b2a78"/>
    <circle cx="-44" cy="-24" r="5" fill="#fff"/><circle cx="56" cy="-24" r="5" fill="#fff"/>
    <path d="M-13 20 L13 20 L0 36 Z" fill="#3b2a78"/>
    <ellipse cx="-100" cy="30" rx="30" ry="19" fill="#ffb3d9"/><ellipse cx="100" cy="30" rx="30" ry="19" fill="#ffb3d9"/>
    <!-- マフラー -->
    <path d="M-120 92 Q0 150 120 92 L120 128 Q0 186 -120 128 Z" fill="#7af0d7" stroke="#8a7bb5" stroke-width="6"/>
    <path d="M70 120 L95 205 L55 205 Z" fill="#7af0d7" stroke="#8a7bb5" stroke-width="6" stroke-linejoin="round"/>
  </g>

  <!-- GO!（ネオン） -->
  <g filter="url(#glow)">
    <text x="320" y="160" font-family="Georgia, serif" font-style="italic" font-weight="700" font-size="104" fill="#fff" stroke="#ff4f8b" stroke-width="3" text-anchor="middle">GO!</text>
  </g>
</svg>
