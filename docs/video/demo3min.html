<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>シマエナGO 3分デモ動画</title>
<!--
  3分の紹介動画（1920x1080）。構成:
    0:00-1:00 静かに。雪かきの大変さとひとりの孤独（暗い色 → 夜明け）
    1:00-2:00 バトル要素と仲間を呼ぶ機能（チーム戦・ヘルプ通知・Claude の採点・カード）
    2:00-2:40 離れた家族・町内のあたたかさ・ウェルビーイング
    2:40-3:00 開発環境の紹介（スマホだけ。寝っ転がって開発）
  使い方: ブラウザで開いて「再生」を押す（音楽つき）。 ?t=75 でその秒の場面を表示。
  動画ファイルにするには: node scripts/render-video.cjs （docs/video/demo3min.mp4 ができる）
  登場する人・町内はすべて架空です。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#5b4636; --ink2:#8a7360; --peach:#f3b08a; --sun:#f6cf72; --sky:#9cc7e8; --line:#e7d5bb;
  --blue:#2F6FE4; --orange:#FF8A3D; --purple:#9B5DE5;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#1b1510;overflow:hidden}
body{display:grid;place-items:center;font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans CJK JP","Noto Sans JP",sans-serif;color:var(--ink)}
#stage{width:1920px;height:1080px;position:relative;overflow:hidden;transform-origin:center center;flex:none;background:#fdf6ec}
#bg{position:absolute;inset:0;animation:bg 180s linear both}
@keyframes bg{0%{background:#18212f}4%{background:#2a384d}28%{background:#4a5a74}30%{background:#56667f}32.3%{background:#fdf6ec}100%{background:#fdf6ec}}
#warm{position:absolute;inset:0;opacity:0;animation:warm 180s linear both}
@keyframes warm{0%,31%{opacity:0}33%{opacity:1}100%{opacity:1}}
.blob{position:absolute;border-radius:50%;background:#f9ead3}
.abs{position:absolute}
.scene{position:absolute;inset:0;opacity:0;animation:sin .9s linear both,sout .9s linear forwards;animation-delay:calc(var(--s)*1s),calc((var(--s) + var(--d) - .9)*1s)}
@keyframes sin{from{opacity:0}to{opacity:1}}
@keyframes sout{from{opacity:1}to{opacity:0}}
.a{opacity:0;animation:rise .9s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--t)*1s)}
.slow{animation-duration:2.4s}
@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.pop{opacity:0;animation:pop .7s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--t)*1s)}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.out{animation:fout .8s linear forwards;animation-delay:calc(var(--o)*1s)}
@keyframes fout{to{opacity:0}}
.fade{opacity:0;animation:fadein 1.6s linear both;animation-delay:calc(var(--t)*1s)}
@keyframes fadein{to{opacity:1}}
.walk{animation:walk 2.2s cubic-bezier(.3,.7,.3,1) both;animation-delay:calc(var(--t)*1s)}
@keyframes walk{from{transform:translate(var(--dx),var(--dy));opacity:0}15%{opacity:1}to{transform:none;opacity:1}}
h1,h2,p{font-weight:900}
.big{font-size:84px;line-height:1.35;letter-spacing:.04em}
.title{font-size:64px;line-height:1.4;letter-spacing:.05em}
.mid{font-size:44px;line-height:1.55;font-weight:700;letter-spacing:.04em;color:var(--ink2)}
.lt{color:#eef1f6}.lt2{color:#b9c4d4}
.mark{background:linear-gradient(transparent 62%,rgba(246,207,114,.8) 62%);padding:0 .1em}
.center{position:absolute;left:0;right:0;text-align:center}
.flake{position:absolute;top:-40px;border-radius:50%;background:#fff;animation:fall linear infinite;opacity:.9}
@keyframes fall{from{transform:translate(0,-40px)}to{transform:translate(-120px,1160px)}}
#snow{position:absolute;inset:0;animation:snowfade 180s linear both}
@keyframes snowfade{0%{opacity:1}30%{opacity:1}34%{opacity:.35}100%{opacity:.35}}
.phone{width:470px;height:780px;border-radius:64px;background:#fff;border:12px solid var(--ink);box-shadow:0 30px 60px rgba(91,70,54,.18);overflow:hidden}
.phone .bar{height:78px;background:var(--sky);display:flex;align-items:center;padding:0 30px;font-size:28px;font-weight:900;color:#fff;letter-spacing:.06em}
.chat{background:#eef5fb;height:100%;padding:26px 22px}
.bub{background:#fff;border-radius:28px;padding:20px 24px;font-size:29px;line-height:1.5;font-weight:700;max-width:370px;box-shadow:0 4px 0 rgba(91,70,54,.06)}
.btns{display:flex;gap:12px}
.btn{flex:1;text-align:center;font-size:30px;font-weight:900;border-radius:999px;padding:16px 0;background:#fff;border:4px solid var(--sky);color:#4f86b0}
.btn.on{background:var(--sun);border-color:var(--sun);color:var(--ink);animation:tap .5s both;animation-delay:calc(var(--t)*1s)}
@keyframes tap{0%{transform:scale(1)}40%{transform:scale(.88)}100%{transform:scale(1.04)}}
.chip{display:inline-block;border-radius:999px;padding:10px 28px;font-size:32px;font-weight:900;color:#fff}
.cells{position:absolute;left:0;top:0;width:900px;height:600px;display:grid;grid-template-columns:repeat(9,100px);grid-template-rows:repeat(6,100px)}
.cell{border:3px solid #eadcc3;background:#fffaf0;border-radius:10px;margin:3px}
.cell.fill{animation:cf .9s both;animation-delay:calc(var(--t)*1s)}
@keyframes cf{from{background:#fffaf0}to{background:var(--c);border-color:var(--c)}}
.cell.need{animation:needc 1s ease-out 5,cf .9s both;animation-delay:calc(var(--p)*1s),calc(var(--t)*1s)}
@keyframes needc{from{border-color:#e04a3f;background:#fde3de;box-shadow:0 0 0 0 rgba(224,74,63,.6)}to{border-color:#e04a3f;background:#fde3de;box-shadow:0 0 0 22px rgba(224,74,63,0)}}
.bar2{height:54px;border-radius:999px;background:#efe3cf;overflow:hidden}
.bar2 i{display:block;height:100%;width:0;border-radius:999px}
.pill{display:inline-block;border-radius:999px;background:#fff;padding:10px 26px;font-size:30px;font-weight:900;box-shadow:0 6px 0 rgba(91,70,54,.08)}
.card{width:480px;height:640px;border-radius:40px;background:linear-gradient(160deg,#fff,#fff4ec 60%,#eef3ff);border:6px solid #fff;box-shadow:0 30px 60px rgba(91,70,54,.22);position:relative;overflow:hidden}
.stamp{position:absolute;right:26px;top:26px;width:150px;height:150px;border-radius:50%;border:5px solid #b9657a;color:#b9657a;font-weight:900;font-size:20px;text-align:center;display:grid;place-items:center;line-height:1.3;transform:rotate(-12deg);background:rgba(255,255,255,.6)}
.tag{display:inline-block;background:#fff;border:4px solid var(--line);border-radius:999px;padding:10px 26px;font-size:34px;font-weight:900;position:absolute;box-shadow:0 8px 0 rgba(91,70,54,.08);animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{margin-top:0}50%{margin-top:-14px}}
.swing{transform-origin:50% 90%;animation:swing 2.4s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
.zz{animation:zz 2.8s ease-in-out infinite}
@keyframes zz{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.drop{animation:drop .45s cubic-bezier(.6,0,1,.6) forwards;animation-delay:calc(var(--t)*1s)}
@keyframes drop{from{transform:none}to{transform:translateY(120px) rotate(-8deg)}}
.shake{animation:shake .5s linear both;animation-delay:calc(var(--t)*1s)}
@keyframes shake{0%{transform:none}15%{transform:translate(-14px,6px)}30%{transform:translate(12px,-6px)}45%{transform:translate(-8px,4px)}60%{transform:translate(6px,-3px)}100%{transform:none}}
#hud{position:absolute;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 54px;font-size:22px;font-weight:700;color:var(--ink2);letter-spacing:.08em;z-index:9;opacity:.8}
#bar{position:absolute;left:0;bottom:0;height:7px;background:var(--peach);width:0;z-index:9}
#start{position:absolute;inset:0;z-index:20;background:rgba(27,21,16,.82);display:grid;place-items:center;color:#fff;font-size:64px;font-weight:900;cursor:pointer;letter-spacing:.1em}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="warm">
    <div class="blob" style="left:-200px;top:-220px;width:700px;height:700px"></div>
    <div class="blob" style="right:-260px;bottom:-300px;width:860px;height:860px"></div>
  </div>
  <div id="snow"></div>
  <div id="scenes"></div>
  <div id="bar"></div>
  <div id="hud"><span id="cap"></span><span id="tc">00.00 / 180.00</span></div>
  <div id="start" style="display:none">▶ クリックで再生（音楽つき）</div>
</div>
<audio id="bgm" src="bgm.mp3" preload="auto"></audio>

<script>
const DUR = 180;

/* ---------- 部品（SVG） ---------- */
const person = (c, hair='#8a6a50') => `<svg width="96" height="124" viewBox="0 0 96 124"><circle cx="48" cy="34" r="26" fill="#fbe0c8"/><path d="M22 30a26 26 0 0 1 52 0q-26-14-52 0z" fill="${hair}"/><circle cx="39" cy="38" r="3.5" fill="#5b4636"/><circle cx="57" cy="38" r="3.5" fill="#5b4636"/><path d="M42 47q6 5 12 0" stroke="#5b4636" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M12 124a36 52 0 0 1 72 0z" fill="${c}"/><circle cx="24" cy="50" r="6" fill="#f3b08a" opacity=".6"/><circle cx="72" cy="50" r="6" fill="#f3b08a" opacity=".6"/></svg>`;
const bird = (c, w=120) => `<svg width="${w}" height="${w}" viewBox="0 0 120 120"><ellipse cx="60" cy="68" rx="44" ry="40" fill="#fff"/><ellipse cx="60" cy="82" rx="30" ry="22" fill="#f5e9d6"/><circle cx="44" cy="58" r="5" fill="#3b2e24"/><circle cx="76" cy="58" r="5" fill="#3b2e24"/><path d="M56 66l4 6 4-6z" fill="#f3b08a"/><path d="M20 56a40 40 0 0 1 80 0" fill="none" stroke="#555" stroke-width="5"/><circle cx="20" cy="60" r="14" fill="${c}"/><circle cx="100" cy="60" r="14" fill="${c}"/><circle cx="32" cy="72" r="6" fill="#f3b08a" opacity=".7"/><circle cx="88" cy="72" r="6" fill="#f3b08a" opacity=".7"/></svg>`;
const house = (o={}) => {
  const wall=o.wall||'#f8dcb9', roof=o.roof||'#d99a72', door=o.door||'#b98562', win=o.win||'#fff6dc', snow=o.snow||'#fff', w=o.w||340;
  return `<svg width="${w}" height="${w*400/340}" viewBox="0 0 340 400"><rect x="40" y="150" width="260" height="190" rx="22" fill="${wall}"/><path d="M10 170 L170 40 L330 170 Z" fill="${roof}" stroke="${roof}" stroke-width="20" stroke-linejoin="round"/><path d="M30 165 Q100 120 170 112 Q250 120 310 165 Q240 152 170 154 Q100 152 30 165Z" fill="${snow}"/><rect x="135" y="230" width="70" height="110" rx="14" fill="${door}"/><rect x="60" y="190" width="56" height="56" rx="10" fill="${win}"/><rect x="224" y="190" width="56" height="56" rx="10" fill="${win}"/></svg>`;
};
const cup = `<svg width="90" height="90" viewBox="0 0 120 120"><path d="M30 44h60v34a24 24 0 0 1-24 24H54a24 24 0 0 1-24-24z" fill="#f6cf72"/><path d="M90 52h10a12 12 0 0 1 0 24H90" fill="none" stroke="#f6cf72" stroke-width="8"/><path d="M50 30q6-10 0-18M70 30q6-10 0-18" stroke="#c9a05a" stroke-width="6" fill="none" stroke-linecap="round"/></svg>`;
const elder = `<svg width="300" height="380" viewBox="0 0 300 380"><g transform="rotate(8 150 300)"><circle cx="130" cy="80" r="46" fill="#fbe0c8"/><path d="M84 76a46 46 0 0 1 92 0q-46-30-92 0z" fill="#e8e8ee"/><circle cx="114" cy="86" r="5" fill="#5b4636"/><circle cx="146" cy="86" r="5" fill="#5b4636"/><path d="M118 104q12 8 24 0" stroke="#5b4636" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M70 340a64 130 0 0 1 128 0z" fill="#7a8fb0"/><rect x="82" y="150" width="96" height="30" rx="15" fill="#c98f6d"/></g><g class="swing"><rect x="206" y="120" width="12" height="230" rx="6" fill="#a8845f"/><path d="M180 340h66l12 34h-90z" fill="#cdd6e2"/></g></svg>`;

/* ---------- 場面を作る ---------- */
const scenes = [];
const S = (s, d, html, cap='') => scenes.push({s, d, html, cap});

// ===== 第1部 0-60 静かに：雪かきの大変さと孤独 =====
S(0, 9, s => `
  <div class="center" style="top:330px"><p class="big a slow lt" style="--t:${s+1}">札幌の冬。</p>
  <p class="mid a slow lt2" style="--t:${s+3.5};margin-top:30px">雪は、音もなく降りつづける。</p></div>`);
S(8, 13, s => `
  <div class="abs fade" style="--t:${s+.5};left:1020px;top:240px">${house({wall:'#6d7b94',roof:'#4a566c',door:'#3b4659',win:'#f6cf72',snow:'#dfe6ef',w:560})}</div>
  <div class="abs" style="left:140px;top:250px">
    <p class="mid a slow lt2" style="--t:${s+.8}">ひと晩で、</p>
    <p class="a slow lt" style="--t:${s+1.6};font-size:200px;line-height:1.1"><span id="depth">0</span><span style="font-size:80px"> cm</span></p>
    <p class="mid a slow lt2" style="--t:${s+7}">朝、玄関の前が、雪でふさがる。</p>
  </div>`);
S(20, 15, s => `
  <div class="abs fade" style="--t:${s+.4};left:980px;top:440px"><div style="width:760px;height:260px;background:#e9eef5;border-radius:50% 50% 0 0;box-shadow:inset 0 14px 40px rgba(120,140,170,.35)"></div></div>
  <div class="abs fade" style="--t:${s+1};left:1130px;top:330px">${elder}</div>
  <div class="abs" style="left:140px;top:260px">
    <p class="big a slow lt" style="--t:${s+1}">ひとりで、1時間。</p>
    <p class="mid a slow lt2" style="--t:${s+6};margin-top:40px">腰が痛い。<br>でも、頼める人がいない。</p>
  </div>`);
S(34, 12, s => `
  <div class="abs" style="left:110px;top:560px;display:flex;gap:30px">
    ${[0,1,2,3,4].map(i => `<div class="fade" style="--t:${s+.5+i*.3}">${house({wall:'#56657e',roof:'#3b465b',door:'#2f394b',win:i===2?'#f6cf72':'#2a3446',snow:'#cfd8e4',w:300})}</div>`).join('')}
  </div>
  <div class="center" style="top:150px">
    <p class="title a slow lt" style="--t:${s+1}">となりの人の顔も、知らない。</p>
    <p class="mid a slow lt2" style="--t:${s+5};margin-top:20px">声を上げるのは、むずかしい。</p>
  </div>`);
S(46, 8, s => `
  <div class="center" style="top:260px">
    <p class="a slow lt2" style="--t:${s+.4};font-size:56px">時間だけが、過ぎていく。</p>
    <p class="a slow lt" style="--t:${s+1};font-size:230px;line-height:1.2;letter-spacing:.06em" id="clk">6:30</p>
    <p class="mid a slow lt2" style="--t:${s+4}">雪は、まだそこにある。</p>
  </div>`);
S(53.5, 6.5, s => `
  <div class="center out" style="top:260px;--o:${s+2.4}">
    <p class="big a slow lt" style="--t:${s+.2}">もし、町内みんなで<br>くっつけたら。</p>
  </div>
  <div class="center" style="top:230px;opacity:1">
    <div class="pop" style="--t:${s+3.4}">${bird('#9B5DE5',150)}</div>
    <h1 class="a" style="--t:${s+3.6};font-size:150px;letter-spacing:.08em;margin-top:10px;color:#5b4636">シマエナGO</h1>
    <p class="mid a" style="--t:${s+4.4};color:#5b4636">寒い冬は、くっついて乗り切る。</p>
  </div>`);

// ===== 第2部 60-120 バトル要素と仲間を呼ぶ =====
S(60, 11, s => `
  <div class="abs" style="left:110px;top:120px;width:560px">
    <p class="chip a" style="--t:${s+.3};background:var(--sky)">毎朝 6:30</p>
    <p class="big a" style="--t:${s+.8};margin-top:24px">雪の朝、<br>LINEに<span class="mark">点呼</span>。</p>
    <p class="mid a" style="--t:${s+2.2};margin-top:30px">質問は1つだけ。<br>1タップで答える。</p>
  </div>
  <div class="abs phone pop" style="--t:${s+.6};left:760px;top:140px"><div class="bar">手伝う側</div><div class="chat">
    <div class="bub a" style="--t:${s+2}">おはようございます。<br>今朝、何分動けますか？</div>
    <div class="btns a" style="--t:${s+3};margin-top:30px"><div class="btn">0</div><div class="btn">15</div><div class="btn on" style="--t:${s+5}">30</div></div>
    <div class="bub a" style="--t:${s+6};margin:36px 0 0 auto;background:var(--sun)">30分、動けます！</div>
  </div></div>
  <div class="abs phone pop" style="--t:${s+1};left:1300px;top:140px"><div class="bar" style="background:var(--peach)">依頼者</div><div class="chat">
    <div class="bub a" style="--t:${s+2.4}">今朝、玄関は<br>出られそうですか？</div>
    <div class="btns a" style="--t:${s+3.4};margin-top:30px"><div class="btn">はい</div><div class="btn on" style="--t:${s+6.5}">いいえ</div></div>
    <div class="bub a" style="--t:${s+7.4};margin:36px 0 0 auto;background:var(--sun)">たすかります…</div>
  </div></div>`, '6:30 エナガ点呼');
S(70, 10, s => `
  <div class="center" style="top:90px">
    <p class="big a" style="--t:${s+.3}">町内に、<span class="mark">3つのチーム</span>。</p>
    <p class="mid a" style="--t:${s+1.2};margin-top:10px">毎週日曜、Claude がランダムにシャッフル。</p>
  </div>
  ${[['サルビア','var(--blue)',250],['マリーゴールド','var(--orange)',760],['ルピナス','var(--purple)',1270]].map(([n,c,x],i)=>`
  <div class="abs pop" style="--t:${s+2+i*.6};left:${x}px;top:440px;width:400px;text-align:center">
    <div style="background:#fff;border-radius:44px;padding:36px 0 30px;border:8px solid ${c};box-shadow:0 20px 40px rgba(91,70,54,.14)">
      ${bird(c,200)}<p style="font-size:48px;margin-top:10px;color:${c}">${n}</p>
    </div></div>`).join('')}
  <div class="center" style="top:930px"><p class="mid a" style="--t:${s+5.5}">赤と緑は使わない。みんなが見分けやすい色で。</p></div>`, 'チーム');
S(80, 12, s => `
  <div class="abs" style="left:90px;top:130px;width:800px">
    <p class="chip a" style="--t:${s+.3};background:#e04a3f">人手不足</p>
    <p class="big a" style="--t:${s+.8};margin-top:24px">足りない家は<br><span class="mark">光って</span>知らせる。</p>
    <p class="mid a" style="--t:${s+3.4};margin-top:24px">近くの仲間へヘルプ通知。<br>「5分でもOK」の小タスク。</p>
    <p class="pill a" style="--t:${s+5.8};margin-top:20px;color:#5a3fa8">ルピナスが駆けつけ</p>
  </div>
  <div class="abs pop" style="--t:${s+.4};left:930px;top:170px;width:906px;height:606px;background:#f6efe0;border-radius:30px;border:6px solid var(--line);overflow:hidden">
    <div class="cells">${Array.from({length:54},(_,i)=>{
      const m={4:['var(--blue)',1.2],5:['var(--blue)',1.7],13:['var(--blue)',2.2],12:['var(--orange)',2.6],21:['var(--orange)',3],22:['var(--orange)',3.3],31:['var(--blue)',3.6],40:['var(--orange)',3.9],41:['var(--orange)',4.2],30:['var(--purple)',4.5]};
      const need=i===23;
      if(need) return `<div class="cell need" style="--p:${s+1.2};--t:${s+6.4};--c:var(--purple)"></div>`;
      if(m[i]) return `<div class="cell fill" style="--t:${s+m[i][1]};--c:${m[i][0]}"></div>`;
      return `<div class="cell"></div>`;}).join('')}</div>
  </div>
  <div class="abs a" style="--t:${s+4.4};left:1250px;top:780px;background:#fff;border-radius:30px;padding:20px 30px;font-size:30px;font-weight:900;box-shadow:0 14px 30px rgba(91,70,54,.18)">通知: 300m先で人手不足です。5分でもOK</div>`, '仲間を呼ぶ');
S(92, 14, s => `
  <div class="center" style="top:70px"><p class="big a" style="--t:${s+.3}">チームで競う。<span class="mark">個人順位はなし。</span></p></div>

const stage = document.getElementById('stage');

addEventListener('resize', fit); fit();

// 雪
const snow = document.getElementById('snow');
for(let i=0;i<70;i++){
  const f=document.createElement('i'); f.className='flake';
  const s=6+((i*7)%14);
  f.style.cssText=`left:${(i*83)%2100-80}px;width:${s}px;height:${s}px;animation-duration:${10+(i%7)*1.8}s;animation-delay:${-(i*1.7)%14}s;opacity:${.45+(i%5)*.1}`;
  snow.appendChild(f);
}

/* ---------- 数字や棒など、時間で変わる部分 ---------- */
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>x*x*(3-2*x);
const $=id=>document.getElementById(id);
const tc=$('tc'), bar=$('bar'), cap=$('cap');
function tick(s){
  let e;
  if(e=$('depth')) e.textContent=Math.round(18*ease(clamp((s-9.5)/6)));
  if(e=$('clk')){ const m=6*60+30+Math.round(120*clamp((s-47)/6)); e.textContent=Math.floor(m/60)+':'+String(m%60).padStart(2,'0'); }
  const p=s-92;
  const sc={ba:[0,2,5,8,10,14,85],bb:[0,2,4,7,10,14,72],bc:[0,2,4,7,10,12,60]};
  // 得点の動き: [開始,..] を使わず、時刻と値の折れ線で
  const line={ba:[[0,0],[2,10],[4.5,15],[9,25],[14,85]],bb:[[0,0],[3,10],[6,20],[9,30],[14,72]],bc:[[0,0],[5,0],[7,10],[9.2,20],[11,35],[14,95]]};
  for(const id in line){
    const pts=line[id]; let v=pts[pts.length-1][1];
    for(let i=1;i<pts.length;i++){ if(p<pts[i][0]){ const [t0,v0]=pts[i-1],[t1,v1]=pts[i]; v=v0+(v1-v0)*ease(clamp((p-t0)/(t1-t0))); break; } }
    if(p<0) v=0;
    if($(id)){ $(id).style.width=Math.min(100,v)+'%'; $(id+'n').textContent=Math.round(v); }
  }
  if($('hp')){ const h=100-100*ease(clamp((p-1)/12)); $('hp').style.width=h+'%'; $('hpn').textContent=Math.round(h); }
  const cur=scenes.filter(x=>s>=x.s&&s<x.s+x.d).pop();
  cap.textContent='シマエナGO / しらかば町内（架空）'+(cur&&cur.cap?'　・　'+cur.cap:'');
  tc.textContent=s.toFixed(2).padStart(6,'0')+' / '+DUR.toFixed(2);
  bar.style.width=(s/DUR*100)+'%';
}
function seek(sec){
  document.getAnimations().forEach(a=>{ const t=a.effect&&a.effect.target; if(t&&t.closest&&t.closest('#stage')){a.pause();a.currentTime=sec*1000;} });
  tick(sec);
}

/* ---------- 再生 ---------- */
const params=new URLSearchParams(location.search);
const audio=$('bgm');
if(params.has('t')){
  requestAnimationFrame(()=>seek(parseFloat(params.get('t'))||0));
}else if(params.has('render')){
  // 書き出し用: 何もしない（scripts/render-video.cjs が seek() を呼ぶ）
  seek(0);
}else{
  const st=$('start'); st.style.display='grid';
  st.onclick=()=>{
    st.style.display='none';
    audio.currentTime=0; audio.play().catch(()=>{});
    const t0=performance.now();
    (function step(){
      const s=audio.paused&&audio.currentTime===0 ? (performance.now()-t0)/1000 : Math.max(audio.currentTime,0);
      if(s>=DUR){ seek(DUR-.01); return; }
      seek(s); requestAnimationFrame(step);
    })();
  };
}
