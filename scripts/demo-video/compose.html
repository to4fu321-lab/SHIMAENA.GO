<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>シマエナGO デモ動画（合成ページ）</title>
<!--
  3分のデモ動画の合成ページ。render（compose.cjs）が ?render=1 で開き、seek(t) で t 秒のコマを出してスクショする。
  読むもの: ../../.video/timeline.js（timeline.cjs ＋ 録画のコマ数 ＋ ナレーションの文）、../../.video/frames/<scene>/00001.jpg（録画のコマ）
  ブラウザで開いて確かめるときは、下の再生ボタンで動く（音はなし）。
-->
<link rel="stylesheet" href="../../.video/fonts/local.css">
<style>
  :root { --paper:#f4f7fa; --ink:#29445c; --ink-deep:#1e3346; --ink-soft:#b7c7d6; --lamp:#d9825b; --lamp-deep:#b8603a; --ice:#8fb8c9; --ice-soft:#e3eef3; --camellia:#c8a7b8; --warm:#f5eee5; --salvia:#2F6FE4; --marigold:#FF8A3D; --lupinus:#9B5DE5; }
  html, body { margin:0; background:#000; }
  body { font-family: "Zen Maru Gothic", "Noto Sans JP", "Hiragino Sans", sans-serif; color:#fff; }
  #stage { position:relative; width:1920px; height:1080px; overflow:hidden; background:radial-gradient(120% 90% at 50% 0%, #2d4b66 0%, #1b2e41 70%); }
  .scene { position:absolute; inset:0; display:none; }
  .scene.on { display:block; }
  .snowbg { position:absolute; inset:0; pointer-events:none; }
  .flake { position:absolute; border-radius:50%; background:#fff; opacity:.7; }
  /* スマホ */
  .phone { position:absolute; left:150px; top:62px; width:430px; height:930px; border:12px solid #0d1620; border-radius:54px; background:#fff; box-shadow:0 30px 60px rgba(0,0,0,.5), 0 0 0 2px rgba(255,255,255,.1); overflow:hidden; }
  .phone img { display:block; width:430px; height:930px; object-fit:cover; }
  .tapfx { position:absolute; width:90px; height:90px; margin:-45px 0 0 -45px; border-radius:50%; border:6px solid var(--lamp); background:rgba(217,130,91,.35); pointer-events:none; opacity:0; }
  .finger { position:absolute; width:46px; height:46px; margin:-14px 0 0 -14px; border-radius:50%; background:rgba(255,255,255,.9); box-shadow:0 4px 12px rgba(0,0,0,.35); opacity:0; }
  .label { position:absolute; left:150px; top:1004px; width:454px; text-align:center; font-size:26px; font-weight:700; color:var(--ink-soft); letter-spacing:.06em; }
  /* テロップ（右） */
  .telops { position:absolute; left:700px; top:120px; width:1140px; display:flex; flex-direction:column; gap:26px; }
  .telop { font-size:60px; font-weight:900; line-height:1.3; color:#fff; text-shadow:0 4px 18px rgba(0,0,0,.35); will-change:transform,opacity; }
  .telop.small { font-size:36px; font-weight:700; color:#dfe8f0; }
  .telop.tag { display:inline-block; align-self:flex-start; background:var(--lamp); color:#fff; padding:14px 36px; border-radius:999px; font-size:52px; box-shadow:0 10px 30px rgba(217,130,91,.45); }
  .card .telops { left:0; top:auto; bottom:300px; width:1920px; align-items:center; text-align:center; }
  .card.low .telops { bottom:220px; }
  .card .telop.tag { align-self:center; }
  .card.top .telops { top:110px; bottom:auto; }
  /* 字幕 */
  .sub { position:absolute; left:660px; width:1220px; top:880px; font-family:"Noto Sans JP", sans-serif; font-size:38px; font-weight:700; line-height:1.5; color:#fff; text-align:left; }
  .sub span { display:inline; background:rgba(10,20,30,.62); padding:8px 18px; border-radius:12px; -webkit-box-decoration-break:clone; box-decoration-break:clone; }
  .card .sub { left:160px; width:1600px; top:900px; text-align:center; }
  .sub.captain { left:0; width:1920px; top:470px; text-align:center; font-family:"Zen Maru Gothic",sans-serif; font-size:46px; }
  .sub.captain span { position:relative; background:#fff; color:var(--ink); border:4px solid var(--salvia); border-radius:999px; padding:14px 40px; box-shadow:0 10px 30px rgba(41,68,92,.18); }
  .sub.captain span::before { content:""; position:absolute; left:50%; top:-26px; margin-left:-16px; border:16px solid transparent; border-bottom-color:var(--salvia); border-top:0; }
  .sub.captain span::after { content:""; position:absolute; left:50%; top:-19px; margin-left:-12px; border:12px solid transparent; border-bottom-color:#fff; border-top:0; }
  .app .sub.captain { left:1080px; width:840px; top:630px; font-size:42px; }
  .titlecard .sub.captain { left:1310px; width:560px; top:230px; text-align:left; }
  .titlecard .sub.captain span::before { left:-28px; top:50%; margin:-16px 0 0 0; border:16px solid transparent; border-right-color:var(--salvia); border-left:0; }
  .titlecard .sub.captain span::after { left:-19px; top:50%; margin:-12px 0 0 0; border:12px solid transparent; border-right-color:#fff; border-left:0; }
  .ochi-bird { position:absolute; left:1300px; top:230px; }
  .sub.daughter span { background:rgba(125,79,104,.92); }
  /* カード共通 */
  .card { background:#1b2e41; }
  .big { position:absolute; left:0; width:1920px; text-align:center; font-weight:900; }
  /* タイトル */
  .title-bg { position:absolute; inset:0; background:linear-gradient(180deg,#f4f7fa 0%,#e3eef3 60%,#d6e4ec 100%); }
  .title-main { top:430px; font-size:150px; color:var(--ink); letter-spacing:.02em; text-shadow:0 6px 0 #fff; }
  .title-tag { top:610px; font-size:56px; color:var(--lamp-deep); font-weight:700; }
  .title-small { top:700px; font-size:38px; color:#4a6076; font-weight:700; }
  .birds { position:absolute; left:0; width:1920px; top:60px; display:flex; justify-content:center; align-items:flex-end; gap:0; }
  .branch { position:absolute; left:560px; top:410px; width:800px; height:14px; background:#6b4a33; border-radius:8px; }
  /* 図 */
  .cols { position:absolute; left:160px; top:230px; width:1600px; display:grid; grid-template-columns:1fr 1fr; gap:60px; }
  .col { background:rgba(255,255,255,.08); border-radius:40px; padding:40px 50px; border:3px solid rgba(255,255,255,.15); }
  .col h2 { margin:0 0 18px; font-size:42px; color:#fff; }
  .col h2 small { display:block; font-size:28px; color:var(--ink-soft); font-weight:700; margin-top:6px; }
  .col li { font-size:33px; line-height:1.5; font-weight:700; list-style:none; }
  .col.ai { border-color:var(--ice); } .col.ai h2 { color:#bfe0ee; }
  .col.human { border-color:var(--lamp); } .col.human h2 { color:#ffd0b5; }
  .col .no { color:#ffd0b5; }
  /* 作り方 */
  .mk-phone { position:absolute; left:150px; top:62px; width:430px; height:930px; border:12px solid #0d1620; border-radius:54px; background:#fff; overflow:hidden; color:var(--ink); }
  .mk-head { position:absolute; left:0; top:0; right:0; z-index:2; background:var(--ink); color:#fff; font-size:22px; font-weight:700; padding:18px 20px 12px; }
  .mk-clip { position:absolute; left:0; top:92px; right:0; bottom:0; overflow:hidden; }
  .mk-head small { display:block; font-size:16px; color:var(--ink-soft); font-weight:500; }
  .mk-list { padding:14px 16px; display:flex; flex-direction:column; gap:10px; will-change:transform; }
  .mk-item { background:var(--ice-soft); border-radius:18px 18px 18px 4px; padding:10px 14px 10px 40px; font-family:"Noto Sans JP",sans-serif; font-size:16px; line-height:1.4; font-weight:500; position:relative; }
  .mk-item svg { position:absolute; left:8px; top:8px; }
  .mk-birds { position:absolute; left:1240px; top:600px; }
  .mk-item.me { background:var(--warm); border-radius:18px 18px 4px 18px; margin-left:40px; }
  .mk-item b { color:var(--lamp-deep); }
  /* 終わり */
  .end-url { top:760px; font-size:54px; color:var(--ink); font-weight:900; letter-spacing:.02em; }
  .end-url2 { top:840px; font-size:32px; color:#4a6076; font-weight:700; }
  .credit { position:absolute; left:0; width:1920px; top:1000px; text-align:center; font-size:22px; color:#4a6076; font-weight:700; }
  #ctrl { position:fixed; left:12px; top:12px; z-index:9; font:14px sans-serif; color:#fff; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="ctrl"><button id="play">▶ 再生（音なし）</button> <input id="pos" type="range" min="0" max="180" step="0.1" value="0" style="width:600px"> <span id="tt">0.0</span></div>
<script src="../../.video/timeline.js"></script>
<script>
const T = window.TIMELINE;
const stage = document.getElementById("stage");
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = (k) => 1 - Math.pow(1 - clamp(k), 3);
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// シマエナガ（lib/mascot-svg.ts と同じ絵）
function mascot(scarf, size = 220, mood = "normal") {
  const eyes = mood === "happy"
    ? `<path d="M40 54 Q45 48 50 54" fill="none" stroke="#1d2f40" stroke-width="3.4" stroke-linecap="round"/><path d="M70 54 Q75 48 80 54" fill="none" stroke="#1d2f40" stroke-width="3.4" stroke-linecap="round"/>`
    : `<circle cx="45" cy="54" r="4.6" fill="#1d2f40"/><circle cx="75" cy="54" r="4.6" fill="#1d2f40"/><circle cx="46.4" cy="52.6" r="1.4" fill="#fff"/><circle cx="76.4" cy="52.6" r="1.4" fill="#fff"/>`;
  return `<svg viewBox="0 0 120 120" width="${size}" height="${size}"><path d="M96 70 L116 62 L112 78 Z" fill="#29445c"/><ellipse cx="60" cy="64" rx="44" ry="42" fill="#ffffff" stroke="#dbe6ee" stroke-width="2"/><path d="M88 52 C104 62 104 86 86 96 C90 82 88 66 80 56 Z" fill="#29445c"/><path d="M32 56 C20 66 22 84 34 92 C32 80 34 66 40 58 Z" fill="#3b6584"/>${eyes}<path d="M56 60 L64 60 L60 66 Z" fill="#1d2f40"/><ellipse cx="36" cy="64" rx="6" ry="3.6" fill="#f2b8bf" opacity="0.8"/><ellipse cx="84" cy="64" rx="6" ry="3.6" fill="#f2b8bf" opacity="0.8"/><path d="M22 76 C40 88 80 88 98 76 L98 86 C80 98 40 98 22 86 Z" fill="${scarf.color}"/><path d="M70 88 L78 112 L90 108 L84 86 Z" fill="${scarf.shade}"/><path d="M26 80 C42 90 78 90 94 80" fill="none" stroke="${scarf.light}" stroke-width="2"/></svg>`;
}
const SCARF = { salvia: { color: "#2F6FE4", shade: "#2457b5", light: "#7fa6f0" }, marigold: { color: "#FF8A3D", shade: "#d9702c", light: "#ffb784" }, lupinus: { color: "#9B5DE5", shade: "#7a44bd", light: "#c39bf0" }, lamp: { color: "#e8834f", shade: "#d06d3b", light: "#f6a57a" } };

// 雪（決まった乱数で、何度描いても同じ）
function snowLayer(seed, n, opts = {}) {
  const r = rng(seed); const el = document.createElement("div"); el.className = "snowbg";
  const flakes = [];
  for (let i = 0; i < n; i++) { const f = document.createElement("div"); f.className = "flake"; const s = 3 + r() * 7; f.style.width = f.style.height = s + "px"; f.style.opacity = (0.35 + r() * 0.5) * (opts.alpha ?? 1); el.append(f); flakes.push({ el: f, x: r() * 1920, y: r() * 1080, v: 30 + r() * 60 + s * 6, w: 10 + r() * 20, p: r() * 6.28 }); }
  el.update = (t) => { for (const f of flakes) { const y = (f.y + t * f.v * (opts.speed ?? 1)) % 1080; const x = (f.x + Math.sin(t * 0.7 + f.p) * f.w + t * 12) % 1920; f.el.style.transform = `translate(${x}px,${y}px)`; } };
  return el;
}

// ---- 人物（丸くてやわらかい絵柄。シマエナガと同じ色づかい）----
// 200×300 の枠。足の底が y=292。pose: shovel / back（腰に手）/ cane / blower / wave / cup / child
function person(o) {
  const { x = 0, y = 0, s = 1, flip = false, skin = "#f3d9c6", coat = "#29445c", pants = "#1e3346", hat = "#c0392b", hair = "#3b2a22", scarf = "#d9825b", boots = "#2a2a2a", mitt = "#c0392b", pose = "shovel", face = "smile", kind = "adult", id = "", lean = 0 } = o;
  const child = kind === "child", elder = kind === "elder";
  const H = child ? 0.8 : 1; // 子どもは頭を大きく、体を短く
  const headR = child ? 40 : 34, headY = child ? 92 : 78;
  const bodyTop = headY + headR - 6, bodyBot = child ? 232 : 250;
  const legTop = bodyBot - 12;
  const headPart = () => {
    let top;
    if (elder) top = `<path d="M${100 - headR} ${headY - 4} Q100 ${headY - headR - 10} ${100 + headR} ${headY - 4} Q100 ${headY + 2} ${100 - headR} ${headY - 4}Z" fill="#d9d2cc"/><circle cx="${100 + headR - 8}" cy="${headY - headR + 6}" r="11" fill="#d9d2cc"/>`;
    else if (o.beanie === false) top = `<path d="M${100 - headR} ${headY} Q${100 - headR} ${headY - headR - 4} 100 ${headY - headR - 2} Q${100 + headR} ${headY - headR - 4} ${100 + headR} ${headY} Q${100 + headR - 6} ${headY - 10} 100 ${headY - 14} Q${100 - headR + 6} ${headY - 10} ${100 - headR} ${headY}Z" fill="${hair}"/>`;
    else top = `<path d="M${100 - headR - 2} ${headY - 2} Q100 ${headY - headR - 14} ${100 + headR + 2} ${headY - 2} L${100 + headR + 2} ${headY + 6} Q100 ${headY - 2} ${100 - headR - 2} ${headY + 6}Z" fill="${hat}"/><rect x="${100 - headR - 4}" y="${headY - 4}" width="${headR * 2 + 8}" height="14" rx="7" fill="${hat}" filter="brightness(.85)"/><circle cx="100" cy="${headY - headR - 10}" r="9" fill="#fff"/>`;
    const eyes = face === "happy"
      ? `<path d="M86 ${headY + 2} q6 -7 12 0" fill="none" stroke="#1d2f40" stroke-width="3.2" stroke-linecap="round"/><path d="M102 ${headY + 2} q6 -7 12 0" fill="none" stroke="#1d2f40" stroke-width="3.2" stroke-linecap="round"/>`
      : face === "tired"
        ? `<path d="M86 ${headY + 2} q6 4 12 0" fill="none" stroke="#1d2f40" stroke-width="3.2" stroke-linecap="round"/><path d="M102 ${headY + 2} q6 4 12 0" fill="none" stroke="#1d2f40" stroke-width="3.2" stroke-linecap="round"/>`
        : `<circle cx="91" cy="${headY + 2}" r="3.4" fill="#1d2f40"/><circle cx="109" cy="${headY + 2}" r="3.4" fill="#1d2f40"/>`;
    const mouth = face === "tired" ? `<path d="M95 ${headY + 16} q5 -4 10 0" fill="none" stroke="#1d2f40" stroke-width="2.6" stroke-linecap="round"/>` : face === "open" ? `<ellipse cx="100" cy="${headY + 16}" rx="5" ry="6" fill="#8f3a3a"/>` : `<path d="M94 ${headY + 14} q6 6 12 0" fill="none" stroke="#1d2f40" stroke-width="2.6" stroke-linecap="round"/>`;
    const glasses = elder ? `<circle cx="91" cy="${headY + 2}" r="8" fill="none" stroke="#5b4636" stroke-width="2"/><circle cx="109" cy="${headY + 2}" r="8" fill="none" stroke="#5b4636" stroke-width="2"/><path d="M99 ${headY + 2} h2" stroke="#5b4636" stroke-width="2"/>` : "";
    return `<circle cx="100" cy="${headY}" r="${headR}" fill="${skin}"/>${top}${eyes}${glasses}<ellipse cx="82" cy="${headY + 11}" rx="6" ry="3.6" fill="#f2b8bf" opacity=".8"/><ellipse cx="118" cy="${headY + 11}" rx="6" ry="3.6" fill="#f2b8bf" opacity=".8"/>${mouth}`;
  };
  const scarfPart = `<path d="M${100 - headR + 4} ${bodyTop + 2} Q100 ${bodyTop + 16} ${100 + headR - 4} ${bodyTop + 2} L${100 + headR - 2} ${bodyTop + 12} Q100 ${bodyTop + 28} ${100 - headR + 2} ${bodyTop + 12}Z" fill="${scarf}"/><path d="M${100 + headR - 14} ${bodyTop + 10} l14 30 l-16 6 l-10 -30Z" fill="${scarf}" filter="brightness(.85)"/>`;
  const body = `<path d="M${100 - 34 * H} ${bodyTop + 10} Q100 ${bodyTop - 4} ${100 + 34 * H} ${bodyTop + 10} L${100 + 46 * H} ${bodyBot} Q100 ${bodyBot + 14} ${100 - 46 * H} ${bodyBot}Z" fill="${coat}"/><path d="M${100 - 44 * H} ${bodyBot - 26} Q100 ${bodyBot - 16} ${100 + 44 * H} ${bodyBot - 26}" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="5"/><circle cx="100" cy="${bodyTop + 40}" r="3.5" fill="rgba(255,255,255,.55)"/><circle cx="100" cy="${bodyTop + 62}" r="3.5" fill="rgba(255,255,255,.55)"/>`;
  const legs = `<rect x="${100 - 30 * H}" y="${legTop}" width="${26 * H + 2}" height="${292 - legTop - 16}" rx="10" fill="${pants}"/><rect x="${100 + 4 * H}" y="${legTop}" width="${26 * H + 2}" height="${292 - legTop - 16}" rx="10" fill="${pants}"/><rect x="${100 - 36 * H}" y="268" width="${34 * H + 4}" height="24" rx="10" fill="${boots}"/><rect x="${100 + 2 * H}" y="268" width="${34 * H + 4}" height="24" rx="10" fill="${boots}"/>`;
  const sh = bodyTop + 22; // 肩の高さ
  const arm = (d, mx, my) => `<path d="${d}" fill="none" stroke="${coat}" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${mx}" cy="${my}" r="12" fill="${mitt}"/>`;
  let arms = "", tool = "", extra = "", behind = "", front = "";
  if (pose === "shovel") {
    // 両手でスコップ。柄は手の中を通り、刃は足元の雪に。動かすのは .arm グループ
    const shovel = (len = 180) => `<g transform="translate(176 ${sh - 6}) rotate(-42)"><rect x="-5.5" y="0" width="11" height="${len}" rx="5" fill="#8b5a2b"/><rect x="-14" y="-6" width="28" height="12" rx="6" fill="#8b5a2b"/><path d="M-27 ${len - 10} L27 ${len - 10} L21 ${len + 36} L-21 ${len + 36}Z" fill="#6b7f92"/><path d="M-27 ${len - 10} L27 ${len - 10} L25 ${len - 2} L-25 ${len - 2}Z" fill="#9fb0bf"/></g>`;
    // 柄の向き (sin42, cos42) = (0.67, 0.74)。手は柄の上から 40 と 100 の所
    arms = `<g class="arm">${shovel(child ? 130 : 180)}${arm(`M${100 + 26 * H} ${sh} Q180 ${sh + 4} 203 ${sh + 24}`, 203, sh + 24)}${arm(`M${100 - 6 * H} ${sh + 26} Q150 ${sh + 90} 243 ${sh + 68}`, 243, sh + 68)}</g>`;
  } else if (pose === "back") { // 腰に手（痛い）: ひじを外に張って、手は腰の後ろ（体の後ろに描く）
    behind = arm(`M${100 + 28 * H} ${sh} Q${100 + 78 * H} ${sh + 40} ${100 + 30 * H} ${bodyBot - 30}`, 100 + 24 * H, bodyBot - 30) + arm(`M${100 - 28 * H} ${sh} Q${100 - 78 * H} ${sh + 40} ${100 - 30 * H} ${bodyBot - 30}`, 100 - 24 * H, bodyBot - 30);
    tool = `<g transform="rotate(18 150 ${bodyBot})"><rect x="150" y="${sh - 10}" width="11" height="${292 - sh}" rx="5" fill="#8b5a2b"/><path d="M135 ${270} l44 0 l10 30 l-64 0Z" fill="#6b7f92"/></g>`;
    extra = `<g class="ouch"><path d="M${100 + 62 * H} ${bodyBot - 56} l6 -16 l6 14 l14 -8 l-8 14 l16 2 l-16 6 l8 14 l-14 -8 l-6 14 l-6 -16 l-14 8 l8 -14 l-16 -2 l16 -6 l-8 -14Z" fill="#ffd27a" stroke="#c0392b" stroke-width="2"/><text x="${100 + 84 * H}" y="${bodyBot - 70}" font-size="30" font-weight="900" fill="#c0392b" font-family="Zen Maru Gothic">ズキッ</text></g>`;
  } else if (pose === "cane") {
    arms = arm(`M${100 + 28 * H} ${sh} Q${100 + 54} ${sh + 40} ${100 + 50} ${sh + 86}`, 150, sh + 90) + arm(`M${100 - 28 * H} ${sh} Q${100 - 56} ${sh + 30} ${100 - 60} ${sh + 70}`, 40, sh + 74);
    tool = `<rect x="146" y="${sh + 90}" width="9" height="${292 - sh - 92}" rx="4" fill="#8b5a2b"/><rect x="134" y="${sh + 84}" width="30" height="12" rx="6" fill="#8b5a2b"/>`;
  } else if (pose === "blower") {
    arms = arm(`M${100 + 28 * H} ${sh} Q${100 + 56} ${sh + 30} ${100 + 62} ${sh + 56}`, 164, sh + 58) + arm(`M${100 - 28 * H} ${sh} Q${100 - 20} ${sh + 46} ${100 + 24} ${sh + 60}`, 128, sh + 64);
    tool = `<g><rect x="130" y="${sh + 56}" width="70" height="12" rx="6" fill="#444"/><rect x="178" y="${sh + 40}" width="110" height="80" rx="16" fill="#c0392b"/><rect x="190" y="${sh + 8}" width="34" height="40" rx="8" fill="#555"/><rect x="266" y="${sh + 48}" width="40" height="50" rx="8" fill="#8a1f16"/><circle cx="205" cy="${sh + 126}" r="20" fill="#222"/><circle cx="205" cy="${sh + 126}" r="8" fill="#888"/><circle cx="272" cy="${sh + 126}" r="20" fill="#222"/><circle cx="272" cy="${sh + 126}" r="8" fill="#888"/><path d="M246 ${sh + 40} l0 -46 q0 -16 16 -16 l22 0" fill="none" stroke="#555" stroke-width="18" stroke-linecap="round"/><g class="spray" fill="#eaf4fa" stroke="#9cc3d8" stroke-width="2"><circle cx="300" cy="${sh - 26}" r="9"/><circle cx="326" cy="${sh - 44}" r="12"/><circle cx="356" cy="${sh - 68}" r="15"/><circle cx="390" cy="${sh - 98}" r="18"/><circle cx="426" cy="${sh - 128}" r="14" opacity=".7"/></g></g>`;
  } else if (pose === "wave") {
    arms = arm(`M${100 + 28 * H} ${sh} Q${100 + 60} ${sh - 10} ${100 + 62} ${sh - 50}`, 164, sh - 56) + arm(`M${100 - 28 * H} ${sh} Q${100 - 56} ${sh + 40} ${100 - 50} ${sh + 80}`, 50, sh + 84);
  } else if (pose === "cup") {
    arms = arm(`M${100 + 28 * H} ${sh} Q${100 + 60} ${sh + 30} ${100 + 26} ${sh + 56}`, 124, sh + 58) + arm(`M${100 - 28 * H} ${sh} Q${100 - 60} ${sh + 30} ${100 - 26} ${sh + 56}`, 76, sh + 58);

const built = T.scenes.map((s) => {

  else {
    el = document.createElement("div"); el.className = "scene app";

    const img = el.querySelector("img"); const count = T.frames[s.scene] || 1;
    const phone = el.querySelector(".phone"); const fx = document.createElement("div"); fx.className = "tapfx"; const fg = document.createElement("div"); fg.className = "finger"; phone.append(fx, fg);
    const taps = Object.values((T.rec && T.rec[s.scene] && T.rec[s.scene].marks) || {}).filter((m) => m && m.x != null).map((m) => ({ t: m.t - s.from, x: m.x * 430 / 390, y: m.y * 930 / 844 }));
    el.update = (lt) => { snow.update(lt);
      let on = null; for (const tp of taps) { const d = lt - tp.t; if (d > -0.45 && d < 0.7) on = { ...tp, d }; }
      if (on) { const k = clamp((on.d + 0.45) / 0.45); fg.style.left = on.x + "px"; fg.style.top = on.y + "px"; fg.style.opacity = on.d < 0 ? k * 0.9 : Math.max(0, 0.9 - on.d * 2); fg.style.transform = `scale(${on.d < 0 ? 1.3 - k * 0.3 : 1})`;
        const r = clamp(on.d / 0.7); fx.style.left = on.x + "px"; fx.style.top = on.y + "px"; fx.style.opacity = on.d < 0 ? 0 : 1 - r; fx.style.transform = `scale(${0.3 + r * 1.4})`; }
      else { fg.style.opacity = 0; fx.style.opacity = 0; }
      const idx = clamp(Math.floor((s.from + lt) * T.fps) + 1, 1, count); const src = `../../.video/frames/${s.scene}/${String(idx).padStart(5, "0")}.jpg`; if (img.getAttribute("src") !== src) img.src = src; el.pending = img.decode().catch(() => {}); };

  el.append(telops);

  stage.append(el);

const WHO = { narr: "", captain: "captain", daughter: "daughter" };
async function seek(t) {
  t = clamp(t, 0, T.seconds - 0.001);
  const i = T.scenes.findIndex((s) => t >= s.start && t < s.end);
  const s = T.scenes[i], el = built[i], lt = t - s.start;
  built.forEach((e, j) => e.classList.toggle("on", j === i));
  el.style.opacity = s.kind === "card" ? ease(lt / 0.35) : 1;
  el.update(lt, t);
  for (const tp of s.telops) { const kin = ease((t - tp.t0) / 0.35), kout = clamp((tp.t1 - t) / 0.25); tp.el.style.opacity = Math.min(kin, kout); tp.el.style.transform = `translateY(${(1 - kin) * 24}px)`; }
  // 字幕
  let text = "", who = "";
  for (const [id, at] of s.voice) { const n = T.narration[id]; if (n && t >= at && t < at + n.seconds + 0.35) { text = n.sub || n.text; who = WHO[n.who]; } }
  if (!text) { // 前のシーンの声が少し食い込むとき
    const prev = T.scenes[i - 1]; if (prev) for (const [id, at] of prev.voice) { const n = T.narration[id]; if (n && t >= at && t < at + n.seconds + 0.35) { text = n.sub || n.text; who = WHO[n.who]; } }
  }
  if (s.nosub) text = "";
  s.subEl.className = "sub " + who;
  s.subEl.innerHTML = text ? `<span>${(who === "daughter" ? "🎤 " : "") + text.replace(/／/g, "<br>")}</span>` : "";
  if (el.pending) await el.pending;
}
window.seek = seek;

// ブラウザで確かめる用（音なし）
if (!location.search.includes("render=1")) {
  const pos = document.getElementById("pos"), tt = document.getElementById("tt"); let playing = false, t0 = 0, base = 0;
  const tick = () => { if (!playing) return; const t = base + (performance.now() - t0) / 1000; if (t >= T.seconds) { playing = false; return; } pos.value = t; tt.textContent = t.toFixed(1); seek(t); requestAnimationFrame(tick); };
  document.getElementById("play").onclick = () => { playing = !playing; base = Number(pos.value); t0 = performance.now(); tick(); };
  pos.oninput = () => { playing = false; tt.textContent = pos.value; seek(Number(pos.value)); };
  seek(0);
} else { document.getElementById("ctrl").style.display = "none"; }
</script>
