<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>シマエナGO デモ動画（合成ページ）</title>
<!--
  3分のデモ動画の合成ページ。render（compose.cjs）が ?render=1 で開き、seek(t) で t 秒のコマを出してスクショする。
  読むもの: ../../.video/timeline.js（timeline.cjs ＋ 録画のコマ数 ＋ ナレーションの文）、../../.video/frames/<scene>/00001.jpg（録画のコマ）
  ブラウザで開いて確かめるときは、下の再生ボタンで動く（音はなし）。
-->
<link rel="stylesheet" href="../../.video/fonts/local.css">
<style>
  :root { --paper:#f4f7fa; --ink:#29445c; --ink-deep:#1e3346; --ink-soft:#b7c7d6; --lamp:#d9825b; --lamp-deep:#b8603a; --ice:#8fb8c9; --ice-soft:#e3eef3; --camellia:#c8a7b8; --warm:#f5eee5; --salvia:#2F6FE4; --marigold:#FF8A3D; --lupinus:#9B5DE5; }
  html, body { margin:0; background:#000; }
  body { font-family: "Zen Maru Gothic", "Noto Sans JP", "Hiragino Sans", sans-serif; color:#fff; }
  #stage { position:relative; width:1920px; height:1080px; overflow:hidden; background:radial-gradient(120% 90% at 50% 0%, #2d4b66 0%, #1b2e41 70%); }
  .scene { position:absolute; inset:0; display:none; }
  .scene.on { display:block; }
  .snowbg { position:absolute; inset:0; pointer-events:none; }
  .flake { position:absolute; border-radius:50%; background:#fff; opacity:.7; }
  /* スマホ */
  .phone { position:absolute; left:150px; top:62px; width:430px; height:930px; border:12px solid #0d1620; border-radius:54px; background:#fff; box-shadow:0 30px 60px rgba(0,0,0,.5), 0 0 0 2px rgba(255,255,255,.1); overflow:hidden; }
  .phone img { display:block; width:430px; height:930px; object-fit:cover; }
  .label { position:absolute; left:150px; top:1004px; width:454px; text-align:center; font-size:26px; font-weight:700; color:var(--ink-soft); letter-spacing:.06em; }
  /* テロップ（右） */
  .telops { position:absolute; left:700px; top:120px; width:1140px; display:flex; flex-direction:column; gap:26px; }
  .telop { font-size:60px; font-weight:900; line-height:1.3; color:#fff; text-shadow:0 4px 18px rgba(0,0,0,.35); will-change:transform,opacity; }
  .telop.small { font-size:36px; font-weight:700; color:#dfe8f0; }
  .telop.tag { display:inline-block; align-self:flex-start; background:var(--lamp); color:#fff; padding:14px 36px; border-radius:999px; font-size:52px; box-shadow:0 10px 30px rgba(217,130,91,.45); }
  .card .telops { left:0; top:auto; bottom:300px; width:1920px; align-items:center; text-align:center; }
  .card .telop.tag { align-self:center; }
  .card.top .telops { top:110px; bottom:auto; }
  /* 字幕 */
  .sub { position:absolute; left:700px; width:1140px; top:880px; font-family:"Noto Sans JP", sans-serif; font-size:40px; font-weight:700; line-height:1.5; color:#fff; text-align:left; }
  .sub span { display:inline; background:rgba(10,20,30,.62); padding:8px 18px; border-radius:12px; -webkit-box-decoration-break:clone; box-decoration-break:clone; }
  .card .sub { left:160px; width:1600px; top:900px; text-align:center; }
  .sub.captain span { background:rgba(217,130,91,.92); }
  .sub.daughter span { background:rgba(125,79,104,.92); }
  /* カード共通 */
  .card { background:#1b2e41; }
  .big { position:absolute; left:0; width:1920px; text-align:center; font-weight:900; }
  /* タイトル */
  .title-bg { position:absolute; inset:0; background:linear-gradient(180deg,#f4f7fa 0%,#e3eef3 60%,#d6e4ec 100%); }
  .title-main { top:430px; font-size:150px; color:var(--ink); letter-spacing:.02em; text-shadow:0 6px 0 #fff; }
  .title-tag { top:610px; font-size:56px; color:var(--lamp-deep); font-weight:700; }
  .title-small { top:700px; font-size:30px; color:#4a6076; font-weight:700; }
  .birds { position:absolute; left:0; width:1920px; top:60px; display:flex; justify-content:center; align-items:flex-end; gap:0; }
  .branch { position:absolute; left:560px; top:410px; width:800px; height:14px; background:#6b4a33; border-radius:8px; }
  /* 図 */
  .cols { position:absolute; left:160px; top:230px; width:1600px; display:grid; grid-template-columns:1fr 1fr; gap:60px; }
  .col { background:rgba(255,255,255,.08); border-radius:40px; padding:40px 50px; border:3px solid rgba(255,255,255,.15); }
  .col h2 { margin:0 0 18px; font-size:42px; color:#fff; }
  .col h2 small { display:block; font-size:28px; color:var(--ink-soft); font-weight:700; margin-top:6px; }
  .col li { font-size:33px; line-height:1.5; font-weight:700; list-style:none; }
  .col.ai { border-color:var(--ice); } .col.ai h2 { color:#bfe0ee; }
  .col.human { border-color:var(--lamp); } .col.human h2 { color:#ffd0b5; }
  .col .no { color:#ffd0b5; }
  /* 作り方 */
  .mk-phone { position:absolute; left:150px; top:62px; width:430px; height:930px; border:12px solid #0d1620; border-radius:54px; background:#fff; overflow:hidden; color:var(--ink); }
  .mk-head { background:var(--ink); color:#fff; font-size:22px; font-weight:700; padding:18px 20px 12px; }
  .mk-head small { display:block; font-size:16px; color:var(--ink-soft); font-weight:500; }
  .mk-list { padding:14px 16px; display:flex; flex-direction:column; gap:10px; will-change:transform; }
  .mk-item { background:var(--ice-soft); border-radius:18px 18px 18px 4px; padding:10px 14px; font-family:"Noto Sans JP",sans-serif; font-size:16px; line-height:1.4; font-weight:500; }
  .mk-item.me { background:var(--warm); border-radius:18px 18px 4px 18px; margin-left:40px; }
  .mk-item b { color:var(--lamp-deep); }
  /* 終わり */
  .end-url { top:760px; font-size:54px; color:var(--ink); font-weight:900; letter-spacing:.02em; }
  .end-url2 { top:840px; font-size:32px; color:#4a6076; font-weight:700; }
  .credit { position:absolute; left:0; width:1920px; top:1000px; text-align:center; font-size:22px; color:#4a6076; font-weight:700; }
  #ctrl { position:fixed; left:12px; top:12px; z-index:9; font:14px sans-serif; color:#fff; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="ctrl"><button id="play">▶ 再生（音なし）</button> <input id="pos" type="range" min="0" max="180" step="0.1" value="0" style="width:600px"> <span id="tt">0.0</span></div>
<script src="../../.video/timeline.js"></script>
<script>
const T = window.TIMELINE;
const stage = document.getElementById("stage");
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = (k) => 1 - Math.pow(1 - clamp(k), 3);
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// シマエナガ（lib/mascot-svg.ts と同じ絵）
function mascot(scarf, size = 220, mood = "normal") {
  const eyes = mood === "happy"
    ? `<path d="M40 54 Q45 48 50 54" fill="none" stroke="#1d2f40" stroke-width="3.4" stroke-linecap="round"/><path d="M70 54 Q75 48 80 54" fill="none" stroke="#1d2f40" stroke-width="3.4" stroke-linecap="round"/>`
    : `<circle cx="45" cy="54" r="4.6" fill="#1d2f40"/><circle cx="75" cy="54" r="4.6" fill="#1d2f40"/><circle cx="46.4" cy="52.6" r="1.4" fill="#fff"/><circle cx="76.4" cy="52.6" r="1.4" fill="#fff"/>`;
  return `<svg viewBox="0 0 120 120" width="${size}" height="${size}"><path d="M96 70 L116 62 L112 78 Z" fill="#29445c"/><ellipse cx="60" cy="64" rx="44" ry="42" fill="#ffffff" stroke="#dbe6ee" stroke-width="2"/><path d="M88 52 C104 62 104 86 86 96 C90 82 88 66 80 56 Z" fill="#29445c"/><path d="M32 56 C20 66 22 84 34 92 C32 80 34 66 40 58 Z" fill="#3b6584"/>${eyes}<path d="M56 60 L64 60 L60 66 Z" fill="#1d2f40"/><ellipse cx="36" cy="64" rx="6" ry="3.6" fill="#f2b8bf" opacity="0.8"/><ellipse cx="84" cy="64" rx="6" ry="3.6" fill="#f2b8bf" opacity="0.8"/><path d="M22 76 C40 88 80 88 98 76 L98 86 C80 98 40 98 22 86 Z" fill="${scarf.color}"/><path d="M70 88 L78 112 L90 108 L84 86 Z" fill="${scarf.shade}"/><path d="M26 80 C42 90 78 90 94 80" fill="none" stroke="${scarf.light}" stroke-width="2"/></svg>`;
}
const SCARF = { salvia: { color: "#2F6FE4", shade: "#2457b5", light: "#7fa6f0" }, marigold: { color: "#FF8A3D", shade: "#d9702c", light: "#ffb784" }, lupinus: { color: "#9B5DE5", shade: "#7a44bd", light: "#c39bf0" }, lamp: { color: "#e8834f", shade: "#d06d3b", light: "#f6a57a" } };

// 雪（決まった乱数で、何度描いても同じ）
function snowLayer(seed, n, opts = {}) {
  const r = rng(seed); const el = document.createElement("div"); el.className = "snowbg";
  const flakes = [];
  for (let i = 0; i < n; i++) { const f = document.createElement("div"); f.className = "flake"; const s = 3 + r() * 7; f.style.width = f.style.height = s + "px"; f.style.opacity = (0.35 + r() * 0.5) * (opts.alpha ?? 1); el.append(f); flakes.push({ el: f, x: r() * 1920, y: r() * 1080, v: 30 + r() * 60 + s * 6, w: 10 + r() * 20, p: r() * 6.28 }); }
  el.update = (t) => { for (const f of flakes) { const y = (f.y + t * f.v * (opts.speed ?? 1)) % 1080; const x = (f.x + Math.sin(t * 0.7 + f.p) * f.w + t * 12) % 1920; f.el.style.transform = `translate(${x}px,${y}px)`; } };
  return el;
}

// ---- カード（イラスト）----
const CARDS = {
  snow() {
    const el = document.createElement("div"); el.className = "scene card top";
    el.innerHTML = `<div style="position:absolute;inset:0;background:linear-gradient(180deg,#0f1c2b 0%,#223b54 55%,#6d8aa6 100%)"></div>
      <svg viewBox="0 0 1920 1080" style="position:absolute;inset:0" width="1920" height="1080">
        <circle cx="1560" cy="160" r="60" fill="#fff8e1" opacity=".9"/>
        <g fill="#0d1a27"><rect x="120" y="470" width="420" height="330"/><polygon points="90,480 330,300 570,480"/><rect x="920" y="520" width="360" height="280"/><polygon points="900,530 1100,380 1300,530"/><rect x="1420" y="500" width="380" height="300"/><polygon points="1400,510 1610,350 1820,510"/></g>
        <g fill="#ffe9a8" opacity=".9"><rect x="200" y="560" width="70" height="80" rx="6"/><rect x="1000" y="600" width="60" height="70" rx="6"/></g>
        <g fill="#eef3f8"><path d="M90 480 L330 300 L570 480 L520 486 L330 345 L140 486 Z"/><path d="M900 530 L1100 380 L1300 530 L1250 536 L1100 420 L950 536 Z"/><path d="M1400 510 L1610 350 L1820 510 L1770 516 L1610 395 L1450 516 Z"/></g>
        <rect x="0" y="790" width="1920" height="290" fill="#f4f7fa"/>
        <ellipse id="mound" cx="1180" cy="860" rx="150" ry="60" fill="#e3eef3"/>
        <g id="person" transform="translate(760 640)">
          <ellipse cx="60" cy="230" rx="90" ry="22" fill="#d6e4ec"/>
          <rect x="18" y="80" width="84" height="130" rx="34" fill="#29445c"/>
          <circle cx="60" cy="50" r="38" fill="#f0d6c4"/><path d="M22 48 C22 10 98 10 98 48 Z" fill="#c0392b"/><circle cx="60" cy="8" r="12" fill="#fff"/>
          <rect x="12" y="200" width="40" height="60" rx="14" fill="#1e3346"/><rect x="68" y="200" width="40" height="60" rx="14" fill="#1e3346"/>
          <g id="arm"><rect x="90" y="100" width="150" height="26" rx="13" fill="#29445c"/><rect x="230" y="60" width="14" height="130" rx="7" fill="#8b5a2b"/><path d="M200 185 L280 185 L300 240 L180 240 Z" fill="#6b7f92"/></g>
        </g>
        <text x="1180" y="990" font-size="34" font-weight="700" fill="#4a6076" text-anchor="middle" font-family="Zen Maru Gothic">イメージ（ここは本人の実写に差し替え可）</text>
      </svg>`;
    const snow = snowLayer(1, 140); el.append(snow);
    const arm = el.querySelector("#arm"), mound = el.querySelector("#mound");
    el.update = (lt) => { snow.update(lt); const k = Math.sin(lt * 4); arm.setAttribute("transform", `rotate(${-18 + k * 22} 100 112)`); mound.setAttribute("ry", 60 + lt * 2.5); mound.setAttribute("rx", 150 + lt * 5); };
    return el;
  },
  sofa() {
    const el = document.createElement("div"); el.className = "scene card top";
    el.innerHTML = `<div style="position:absolute;inset:0;background:radial-gradient(80% 70% at 50% 20%,#4a3a30 0%,#2a1f19 70%)"></div>
      <svg viewBox="0 0 1920 1080" width="1920" height="1080" style="position:absolute;inset:0">
        <rect x="0" y="840" width="1920" height="240" fill="#5b4536"/>
        <circle cx="1560" cy="300" r="120" fill="#ffd27a" opacity=".16"/><path d="M1500 180 L1620 180 L1660 320 L1460 320 Z" fill="#f2c98c"/><rect x="1554" y="320" width="12" height="400" fill="#8a6a4e"/>
        <rect x="260" y="520" width="1200" height="300" rx="70" fill="#7d4f68"/><rect x="300" y="420" width="1120" height="200" rx="60" fill="#8f6179"/>
        <rect x="220" y="560" width="120" height="260" rx="50" fill="#6c4259"/><rect x="1380" y="560" width="120" height="260" rx="50" fill="#6c4259"/>
        <path d="M400 560 C600 480 1100 500 1300 560 L1300 700 C1100 760 600 740 400 700 Z" fill="#c8a7b8"/>
        <g id="feet"><rect x="980" y="330" width="70" height="230" rx="35" fill="#f4e4d0"/><rect x="1080" y="300" width="70" height="260" rx="35" fill="#f4e4d0"/><rect x="975" y="330" width="80" height="80" rx="30" fill="#c0392b"/><rect x="1075" y="300" width="80" height="80" rx="30" fill="#c0392b"/></g>
        <g id="phone"><rect x="560" y="430" width="120" height="200" rx="18" fill="#0d1620" transform="rotate(-18 620 530)"/><rect x="572" y="442" width="96" height="176" rx="12" fill="#f4f7fa" transform="rotate(-18 620 530)"/><circle cx="620" cy="520" r="160" fill="#bfe0ee" opacity=".18"/></g>
        <g><rect x="1560" y="740" width="180" height="70" rx="12" fill="#6b4a33"/><rect x="1610" y="660" width="80" height="80" rx="14" fill="#f4f7fa"/><ellipse cx="1650" cy="660" rx="40" ry="10" fill="#d9825b"/>
          <g id="steam" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".7"><path d="M1630 640 C1620 620 1640 610 1630 590"/><path d="M1660 640 C1650 620 1670 610 1660 590"/></g></g>
        <text x="960" y="1000" font-size="34" font-weight="700" fill="#d9c5b5" text-anchor="middle" font-family="Zen Maru Gothic">イメージ（ソファーの足元とスマホ。実写に差し替え可）</text>
      </svg>`;
    const steam = el.querySelector("#steam"), feet = el.querySelector("#feet"), phone = el.querySelector("#phone");
    el.update = (lt) => { steam.setAttribute("transform", `translate(0 ${-((lt * 25) % 40)})`); steam.setAttribute("opacity", 0.3 + 0.4 * Math.abs(Math.sin(lt * 1.5))); feet.setAttribute("transform", `translate(0 ${Math.sin(lt * 1.2) * 6})`); phone.setAttribute("transform", `translate(0 ${Math.sin(lt * 1.2 + 1) * 4})`); };
    return el;
  },
  title(isEnd) {
    const el = document.createElement("div"); el.className = "scene card";
    el.innerHTML = `<div class="title-bg"></div>
      <div class="branch"></div>
      <div class="birds"><div style="transform:translate(40px,60px) scale(.85)">${mascot(SCARF.marigold, 240)}</div><div style="transform:translate(10px,80px) scale(.8)">${mascot(SCARF.lupinus, 240)}</div><div style="transform:translate(-20px,30px)">${mascot(SCARF.salvia, 300, "happy")}</div></div>
      <div class="big title-main">シマエナGO</div>
      <div class="big title-tag">寒い冬は、くっついて乗り切る。</div>
      ${isEnd ? `<div class="big end-url">shimaena-go.vercel.app</div><div class="big end-url2">github.com/to4fu321-lab/shimaena.go</div><div class="credit">Built with Claude: Japan 2026 ／ 雪かきを入口に、町から「ひとり」をなくす</div>`
              : `<div class="big title-small">雪の朝、エリアのランダム3チームが、ひとり暮らしの家の雪をどけるゲーム</div><div class="credit">Built with Claude: Japan 2026</div>`}`;
    const snow = snowLayer(7, 60, { alpha: 0.9 }); snow.querySelectorAll(".flake").forEach((f) => (f.style.background = "#bfd3e0")); el.append(snow);
    const birds = el.querySelector(".birds");
    el.update = (lt) => { snow.update(lt); birds.style.transform = `translateY(${Math.sin(lt * 2) * 4}px)`; };
    return el;
  },
  end() { return CARDS.title(true); },
  problem() {
    const el = document.createElement("div"); el.className = "scene card";
    el.innerHTML = `<div style="position:absolute;inset:0;background:linear-gradient(180deg,#0f1c2b 0%,#1b2e41 60%,#29445c 100%)"></div>
      <div class="branch" style="top:470px;left:520px;width:880px;background:#4a3324"></div>
      <div class="birds" style="top:90px"><div style="transform:translate(60px,70px) scale(1.05)">${mascot(SCARF.marigold, 280)}</div><div style="transform:translate(20px,95px) scale(1.0)">${mascot(SCARF.lupinus, 280)}</div><div style="transform:translate(-30px,30px) scale(1.1)">${mascot(SCARF.salvia, 330)}</div></div>`;
    const snow = snowLayer(5, 120, { alpha: 0.8 }); el.append(snow);
    const birds = el.querySelector(".birds");
    el.update = (lt) => { snow.update(lt); birds.style.transform = `translateY(${Math.sin(lt * 1.6) * 5}px) scale(${1 + lt * 0.006})`; };
    return el;
  },
  diagram() {
    const el = document.createElement("div"); el.className = "scene card";
    el.innerHTML = `<div class="cols">
      <div class="col ai"><h2>Claude（AI）に任せる<small>段取り</small></h2><ul style="padding:0;margin:0"><li>🧭 家ごとに人数・担当・理由を決める</li><li>📷 写真1枚で「通れるか」を確かめる</li><li>💬 相談にのって、合う参加の仕方をすすめる</li><li>📖 聞き書きから絵本を書く・カードを描く</li></ul></div>
      <div class="col human"><h2>人とプログラムがやる<small>気持ちと安全</small></h2><ul style="padding:0;margin:0"><li>🔢 得点・雪の kg・夜のルール（プログラム）</li><li>🛡 安全の注意・名前と場所は AI に渡さない</li><li>🩺 体調や医療は判断しない</li><li class="no">🎤 「ありがとう」は、本人の声で</li></ul></div>
    </div>
    <div class="big" style="top:80px;font-size:72px;color:#fff">AI は段取りを。<span style="color:#ffd0b5">人は、会いに行く。</span></div>`;
    el.update = () => {};
    return el;
  },
  making() {
    const el = document.createElement("div"); el.className = "scene";
    const items = (T.commits || []).map((c, i) => `<div class="mk-item ${i % 3 === 0 ? "me" : ""}">${i % 3 === 0 ? "🛋 " : "🐦 "}${c.replace(/</g, "&lt;")}</div>`).join("");
    el.innerHTML = `<div class="mk-phone"><div class="mk-head">Claude Code（スマホから）<small>日本語で頼む → 作る → 確かめる → コミット。6日間。</small></div><div class="mk-list" id="mk">${items}</div></div>
      <div style="position:absolute;left:150px;top:1004px;width:454px;text-align:center;font-size:24px;font-weight:700;color:#b7c7d6">このリポジトリの本当のコミット記録</div>`;
    const list = el.querySelector("#mk");
    el.update = (lt) => { list.style.transform = `translateY(${-lt * 60}px)`; };
    return el;
  },
  future() {
    const el = document.createElement("div"); el.className = "scene card";
    const person = (x, y, s, body, hat, tool) => `<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="60" cy="230" rx="80" ry="18" fill="#d6e4ec"/><rect x="18" y="80" width="84" height="130" rx="34" fill="${body}"/><circle cx="60" cy="50" r="38" fill="#f0d6c4"/><path d="M22 48 C22 10 98 10 98 48 Z" fill="${hat}"/><rect x="12" y="200" width="40" height="60" rx="14" fill="#1e3346"/><rect x="68" y="200" width="40" height="60" rx="14" fill="#1e3346"/>${tool}</g>`;
    const shovel = `<g class="arm"><rect x="90" y="100" width="130" height="24" rx="12" fill="#29445c"/><rect x="210" y="70" width="12" height="120" rx="6" fill="#8b5a2b"/><path d="M185 185 L255 185 L270 235 L170 235 Z" fill="#6b7f92"/></g>`;
    const cane = `<rect x="-10" y="110" width="12" height="150" rx="6" fill="#8b5a2b"/>`;
    const blower = `<g class="arm"><rect x="90" y="120" width="60" height="20" rx="10" fill="#29445c"/><rect x="140" y="100" width="130" height="90" rx="18" fill="#c0392b"/><rect x="150" y="60" width="30" height="50" rx="8" fill="#555"/><circle cx="175" cy="200" r="22" fill="#222"/><circle cx="245" cy="200" r="22" fill="#222"/></g>`;
    el.innerHTML = `<div style="position:absolute;inset:0;background:linear-gradient(180deg,#f7c59f 0%,#fbe3c9 35%,#dbe9f1 70%,#f4f7fa 100%)"></div>
      <svg viewBox="0 0 1920 1080" width="1920" height="1080" style="position:absolute;inset:0">
        <circle id="sun" cx="1500" cy="330" r="110" fill="#ffd27a"/>
        <g fill="#8fa9bd" opacity=".85"><rect x="60" y="420" width="380" height="330"/><polygon points="40,430 250,280 460,430"/><rect x="560" y="470" width="300" height="280"/><polygon points="540,480 710,350 880,480"/><rect x="1000" y="440" width="520" height="310"/><rect x="1620" y="400" width="260" height="350"/></g>
        <g fill="#fff"><path d="M40 430 L250 280 L460 430 L420 436 L250 320 L80 436 Z"/><path d="M540 480 L710 350 L880 480 L840 486 L710 388 L580 486 Z"/><rect x="1000" y="425" width="520" height="22" rx="8"/><rect x="1620" y="385" width="260" height="22" rx="8"/></g>
        <g fill="#ffe9a8"><rect x="140" y="520" width="60" height="70" rx="6"/><rect x="1060" y="500" width="50" height="60" rx="6"/><rect x="1160" y="500" width="50" height="60" rx="6"/><rect x="1260" y="500" width="50" height="60" rx="6"/><rect x="1060" y="600" width="50" height="60" rx="6"/><rect x="1160" y="600" width="50" height="60" rx="6"/></g>
        <rect x="0" y="750" width="1920" height="330" fill="#f4f7fa"/>
        ${person(250, 540, 1, "#29445c", "#2F6FE4", shovel)}
        ${person(560, 620, 0.7, "#9B5DE5", "#ffd27a", shovel)}
        ${person(820, 560, 0.95, "#7d4f68", "#c8a7b8", cane)}
        ${person(1080, 540, 1, "#FF8A3D", "#1e3346", blower)}
        ${person(1480, 600, 0.75, "#2F6FE4", "#c0392b", shovel)}
        ${person(1680, 560, 0.95, "#4a6076", "#9B5DE5", shovel)}
        <text x="960" y="1030" font-size="30" font-weight="700" fill="#4a6076" text-anchor="middle" font-family="Zen Maru Gothic">イメージ: マンションの人も、雪かき機の人も、子どもも、お年寄りも、いっしょに</text>
      </svg>`;
    const snow = snowLayer(3, 50, { alpha: 0.8 }); el.append(snow);
    const arms = [...el.querySelectorAll(".arm")], sun = el.querySelector("#sun");
    el.update = (lt) => { snow.update(lt); arms.forEach((a, i) => a.setAttribute("transform", `rotate(${-16 + Math.sin(lt * 3.2 + i) * 20} 100 112)`)); sun.setAttribute("cy", 330 - Math.min(lt, 13) * 6); };
    return el;
  },
};

// ---- 組み立て ----
const built = T.scenes.map((s) => {
  let el;
  if (s.kind === "card") { el = CARDS[s.card](); }
  else {
    el = document.createElement("div"); el.className = "scene app";
    el.innerHTML = `<div class="phone"><img></div><div class="label">${({ home: "A 手伝う人（田中さん）", ask: "C お願いする家（小林さん）", chat: "A 手伝う人・隊長トーク", map: "A 手伝う人・町の地図", finish: "A 手伝う人・写真で完了", thanks: "C お願いする家・声のありがとう", listen: "A 手伝う人・届いた声", consult: "A 手伝う人・隊長に相談", book: "聞き書き → 町の週刊絵本", "home-end": "ホーム" })[s.scene] || ""}</div>`;
    const snow = snowLayer(11, 50, { alpha: 0.35, speed: 0.6 }); el.prepend(snow);
    const img = el.querySelector("img"); const count = T.frames[s.scene] || 1;
    el.update = (lt) => { snow.update(lt); const idx = clamp(Math.floor((s.from + lt) * T.fps) + 1, 1, count); const src = `../../.video/frames/${s.scene}/${String(idx).padStart(5, "0")}.jpg`; if (img.getAttribute("src") !== src) img.src = src; el.pending = img.decode().catch(() => {}); };
  }
  const telops = document.createElement("div"); telops.className = "telops";
  s.telops.forEach((tp) => { const d = document.createElement("div"); d.className = "telop" + (tp.small ? " small" : "") + (tp.tag ? " tag" : ""); d.textContent = tp.text; d.style.opacity = 0; telops.append(d); tp.el = d; });
  el.append(telops);
  const sub = document.createElement("div"); sub.className = "sub"; el.append(sub); s.subEl = sub;
  stage.append(el);
  return el;
});

const WHO = { narr: "", captain: "captain", daughter: "daughter" };
async function seek(t) {
  t = clamp(t, 0, T.seconds - 0.001);
  const i = T.scenes.findIndex((s) => t >= s.start && t < s.end);
  const s = T.scenes[i], el = built[i], lt = t - s.start;
  built.forEach((e, j) => e.classList.toggle("on", j === i));
  el.style.opacity = s.kind === "card" ? ease(lt / 0.35) : 1;
  el.update(lt, t);
  for (const tp of s.telops) { const kin = ease((t - tp.t0) / 0.35), kout = clamp((tp.t1 - t) / 0.25); tp.el.style.opacity = Math.min(kin, kout); tp.el.style.transform = `translateY(${(1 - kin) * 24}px)`; }
  // 字幕
  let text = "", who = "";
  for (const [id, at] of s.voice) { const n = T.narration[id]; if (n && t >= at && t < at + n.seconds + 0.35) { text = n.text; who = WHO[n.who]; } }
  if (!text) { // 前のシーンの声が少し食い込むとき
    const prev = T.scenes[i - 1]; if (prev) for (const [id, at] of prev.voice) { const n = T.narration[id]; if (n && t >= at && t < at + n.seconds + 0.35) { text = n.text; who = WHO[n.who]; } }
  }
  s.subEl.className = "sub " + who;
  s.subEl.innerHTML = text ? `<span>${(who === "captain" ? "🐦 " : who === "daughter" ? "🎤 " : "") + text}</span>` : "";
  if (el.pending) await el.pending;
}
window.seek = seek;

// ブラウザで確かめる用（音なし）
if (!location.search.includes("render=1")) {
  const pos = document.getElementById("pos"), tt = document.getElementById("tt"); let playing = false, t0 = 0, base = 0;
  const tick = () => { if (!playing) return; const t = base + (performance.now() - t0) / 1000; if (t >= T.seconds) { playing = false; return; } pos.value = t; tt.textContent = t.toFixed(1); seek(t); requestAnimationFrame(tick); };
  document.getElementById("play").onclick = () => { playing = !playing; base = Number(pos.value); t0 = performance.now(); tick(); };
  pos.oninput = () => { playing = false; tt.textContent = pos.value; seek(Number(pos.value)); };
  seek(0);
} else { document.getElementById("ctrl").style.display = "none"; }
</script>
